<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docufirma AyG - Bugatti Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bugatti-blue: #0066FF;
            --deep-black: #050505;
            --carbon: #111111;
            --glass: rgba(15, 15, 15, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--deep-black);
            /* Carbon fiber pattern background */
            background-image: 
                radial-gradient(circle at 2px 2px, rgba(255,255,255,0.05) 1px, transparent 0);
            background-size: 24px 24px;
            color: white;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 500px;
            perspective: 2000px;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 4px; /* Industrial / Precision look */
            padding: 48px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            animation: card-entry 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        /* Racing Blue Accent Line */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: var(--bugatti-blue);
            box-shadow: 0 0 15px var(--bugatti-blue);
        }

        h1 {
            font-weight: 900;
            font-size: 32px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: -0.04em;
            line-height: 0.9;
        }

        p.subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 40px;
            font-weight: 300;
            letter-spacing: 0.02em;
        }

        .form-group {
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 12px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 15px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            color: white;
        }

        input:focus {
            outline: none;
            border-color: var(--bugatti-blue);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(0, 102, 255, 0.2);
        }

        .product-list {
            margin-top: 32px;
            max-height: 160px;
            overflow-y: auto;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            animation: slide-in 0.6s ease forwards;
            opacity: 0;
        }

        .btn-add {
            background: transparent;
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 12px;
            border-radius: 2px;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }

        .btn-add:hover {
            border-color: var(--bugatti-blue);
            color: var(--bugatti-blue);
        }

        .btn-primary {
            width: 100%;
            padding: 20px;
            background: var(--bugatti-blue);
            color: white;
            border: none;
            border-radius: 2px;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.4s;
            margin-top: 40px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(0, 102, 255, 0.4);
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }

        .btn-primary:hover::after {
            left: 100%;
        }

        @keyframes card-entry {
            from { opacity: 0; transform: scale(0.95) rotateY(-5deg); filter: blur(10px); }
            to { opacity: 1; transform: scale(1) rotateY(0); filter: blur(0); }
        }

        @keyframes slide-in {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Custom Scrollbar */
        .product-list::-webkit-scrollbar { width: 3px; }
        .product-list::-webkit-scrollbar-thumb { background: var(--bugatti-blue); }
    </style>
</head>
<body>
    <div class="container">
        <div class="glass-card">
            <h1>Suministro<br>Premium</h1>
            <p class="subtitle">Configuración técnica de entrega. Nivel de precisión Bugatti.</p>
            
            <div class="form-group">
                <label>Componente / Producto</label>
                <input type="text" placeholder="Chiron Carbon Pack">
            </div>

            <div class="form-group" style="display: flex; gap: 16px;">
                <div style="flex: 1;">
                    <label>Cantidad</label>
                    <input type="number" placeholder="1" min="1">
                </div>
                <div style="flex: 1; align-self: flex-end;">
                    <button class="btn-add">+ Registrar</button>
                </div>
            </div>

            <div class="product-list">
                <div class="product-item" style="animation-delay: 0.1s;">
                    <span style="font-weight: 700; font-size: 14px;">Chiron Carbon Pack</span>
                    <span style="color: var(--bugatti-blue); font-weight: 800;">x1</span>
                </div>
                <div class="product-item" style="animation-delay: 0.2s;">
                    <span style="font-weight: 700; font-size: 14px;">Racing Blue Leather</span>
                    <span style="color: var(--bugatti-blue); font-weight: 800;">x4</span>
                </div>
            </div>

            <button class="btn-primary">Continuar al Cotejo</button>
        </div>
    </div>
</body>
</html>
