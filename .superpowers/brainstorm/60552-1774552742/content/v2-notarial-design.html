<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docufirma AyG - Notarial Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0F172A;
            --gold: #B45309;
            --gold-light: #F59E0B;
            --glass: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(15, 23, 42, 0.1);
            --bg-gradient: linear-gradient(135deg, #F8FAFC 0%, #E2E8F0 100%);
        }

        body {
            font-family: 'Lato', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--navy);
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 500px;
            perspective: 1000px;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 12px; /* Menos redondeado para ser más formal */
            padding: 40px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.1);
            animation: card-entry 1s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        /* Gold accent line at the top */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
            border-radius: 12px 12px 0 0;
        }

        h1 {
            font-family: 'EB Garamond', serif;
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--navy);
        }

        p.subtitle {
            font-size: 14px;
            color: #475569;
            margin-bottom: 32px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            color: #64748B;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: white;
            border: 1px solid #CBD5E1;
            border-radius: 4px; /* Cuadrado = Formal */
            box-sizing: border-box;
            font-family: inherit;
            font-size: 16px;
            transition: all 0.3s ease;
            color: var(--navy);
        }

        input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(180, 83, 9, 0.1);
        }

        .product-list {
            margin-top: 24px;
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid #E2E8F0;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.5);
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #E2E8F0;
            background: white;
        }

        .product-item:last-child {
            border-bottom: none;
        }

        .btn-add {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 12px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .btn-add:hover {
            background: rgba(180, 83, 9, 0.05);
            transform: translateY(-1px);
        }

        .btn-primary {
            width: 100%;
            padding: 18px;
            background: var(--navy);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 32px;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.2);
        }

        .btn-primary:hover {
            background: #1E293B;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.3);
        }

        @keyframes card-entry {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .notary-seal {
            position: absolute;
            bottom: -20px;
            right: -20px;
            width: 80px;
            height: 80px;
            background: var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'EB Garamond', serif;
            font-weight: 700;
            font-size: 10px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(180, 83, 9, 0.3);
            border: 2px solid white;
            line-height: 1;
            padding: 10px;
            transform: rotate(15deg);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="glass-card">
            <h1>Nueva Entrega</h1>
            <p class="subtitle">Protocolo de entrega de papelería notarial y suministros oficiales.</p>
            
            <div class="form-group">
                <label>Producto o Suministro</label>
                <input type="text" placeholder="Ej. Libro de Protocolo No. 45">
            </div>

            <div class="form-group" style="display: flex; gap: 16px;">
                <div style="flex: 1;">
                    <label>Cantidad</label>
                    <input type="number" placeholder="1" min="1">
                </div>
                <div style="flex: 1; align-self: flex-end;">
                    <button class="btn-add">+ Añadir</button>
                </div>
            </div>

            <div class="product-list">
                <div class="product-item">
                    <span style="font-weight: 600;">Libro de Protocolo x1</span>
                    <span style="color: #94A3B8; cursor: pointer; font-size: 18px;">&times;</span>
                </div>
                <div class="product-item">
                    <span style="font-weight: 600;">Hojas Testimonio x500</span>
                    <span style="color: #94A3B8; cursor: pointer; font-size: 18px;">&times;</span>
                </div>
            </div>

            <button class="btn-primary">Continuar al Cotejo Oficial</button>

            <div class="notary-seal">
                CALIDAD<br>NOTARIAL<br>A&G
            </div>
        </div>
    </div>
</body>
</html>
